name: Prepare a Nix runner
description: >
  Free enough disk for a Nix build, install Nix, and attach the build cache.
  Shared by every job in the test workflow so the disk fix cannot drift between them.

inputs:
  cache-group:
    description: >
      Which store snapshot this job shares. Jobs in one group restore one cache entry;
      "main" is the Linux dependency tree, "windows" the MSVC cross tree — kept apart
      because they are disjoint closures and together they would not fit an entry.
    default: main
  cache-save:
    description: >
      Whether this job saves the group's snapshot when it finishes. Exactly one job per
      group saves, and only on pushes to main: every extra saver is an extra multi-GB
      entry in a 10 GB budget, and a PR's store belongs to the PR.
    default: "false"
  cache-gc-size:
    description: >
      Prune the store to at most this size before saving, so the entry stays inside its
      share of the repository's 10 GB cache budget. Only meaningful for the saver job.
    default: 12G

runs:
  using: composite
  steps:
    # The reason CI was red from 2026-07-24 to 2026-08-02, on every commit and every
    # dependabot PR: `No space left on device` writing rmeta into a crane target dir. Not a
    # test failure — the job simply grew past the runner's disk, and the shape it fails in
    # is misleading. Sometimes nix reports it; more often the root filesystem fills, the
    # runner service dies with "the runner has received a shutdown signal", and the log
    # just stops mid-build with no error in it at all.
    #
    # A GitHub-hosted runner has ~14 GB free on `/`, which is where `/nix` lives, and this
    # build wants considerably more: a dozen crane derivations that each compile the whole
    # dependency tree into their own `target/`, four NixOS VM tests that build full system
    # closures and disk images, Electron, Widevine, ffmpeg, LLVM and an MSVC sysroot.
    #
    # The image also ships ~25 GB of toolchains this project never touches. Deleting them
    # costs about a minute and buys more room than everything above needs. `df` on both
    # sides so the next person to hit this can see the headroom rather than guess at it.
    - name: Make room for the build
      shell: bash
      run: |
        echo "::group::Disk before"
        df -h /
        echo "::endgroup::"
        # `|| true` throughout: these are the runner image's business, not ours, and a
        # path that has moved or gone away must not fail the build we are making room for.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                    /usr/share/swift /usr/local/share/powershell /usr/local/share/boost \
                    /opt/hostedtoolcache /usr/lib/google-cloud-sdk || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        echo "::group::Disk after"
        df -h /
        echo "::endgroup::"

    # A private repo gets the 2-core / 7 GB runner; the 4-core / 16 GB one is for public
    # repos. Seven gigabytes is not enough for this tree, and the way it fails says so only
    # in the job annotation — "the hosted runner lost communication with the server …
    # starves it for CPU/Memory" — while the log ends mid-build with no error in it.
    #
    # Swap does not make the build fast, it makes it finish. The peak is a small part of a
    # long build, so most of this is never touched; what it buys is that the runner agent
    # keeps its own pages when a link step wants more than the box has, instead of being
    # starved and dropped. There is 37 GB free by this point, so the space is not scarce.
    - name: Give the box somewhere to spill
      shell: bash
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 12G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile >/dev/null
        sudo swapon /swapfile
        # Spill sooner rather than at the cliff: the default 60 keeps anonymous pages
        # resident until it is nearly too late, which on a box this size is the failure.
        sudo sysctl -w vm.swappiness=60 >/dev/null
        free -h

    # The other half of what `checks.android-cast` needs, and the reason it had never once
    # passed on a hosted runner — 25 red jobs from the day it landed (#338).
    #
    # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`, which lets an
    # unprivileged process create a user namespace and then refuses the `uid_map` write
    # that would make it useful: `unshare: write failed /proc/self/uid_map: Operation not
    # permitted`. The check needs that namespace because a nix build has no capabilities
    # at all (`CapEff: 0000000000000000`), so the nested userns is what buys CAP_NET_ADMIN
    # and lets `ip tuntap add` work.
    #
    # Established by probing the runner rather than reasoning about it. The same `unshare`
    # fails identically *outside* nix, which is what rules out the sandbox, the KVM builder
    # and the emulator; and with this sysctl cleared the whole sequence — nested userns,
    # netns, tap creation inside it — succeeds inside the sandbox, while the two operations
    # that fail on the dev box (`unshare --net` alone, a tap in the sandbox's own netns)
    # keep failing there too. Runner and bench then agree operation for operation.
    #
    # Scoped to the runner's own ephemeral VM, and a relaxation nothing else here exercises.
    - name: Let a nix build open a user namespace
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # `extra-sandbox-paths`: `checks.android-cast` builds a TAP inside the sandbox's
    # network namespace to put the Android emulator and the receiver on one L2 segment
    # (#225). The namespace is the sysctl above; creating a tap in it needs one more thing,
    # because the sandbox's /dev has no `net/tun` and a user namespace cannot mknod one.
    # Bind-mounting the host's is the rest of the fix. Harmless for every other job — a
    # path in the sandbox that nothing else opens — and the alternative was keeping the
    # network leg out of `nix flake check` entirely.
    - uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: |
          extra-sandbox-paths = /dev/net/tun

    # One cache entry per group, not one per store path. magic-nix-cache stored every
    # store path as its own GitHub Actions cache entry; this repository's closure made
    # that ~9,000 entries pinned at the 10 GB eviction ceiling, so the big artifacts
    # (the crane dependency trees, the VM system closures) evicted before any job could
    # reuse them — `check (build)` rebuilt, from scratch, the same derivation a warming
    # job had finished minutes earlier (#238). magic-nix-cache is also EOL upstream.
    #
    # cache-nix-action snapshots the whole store as a single entry per key: one restore,
    # one save, no per-path API traffic to rate-limit. The key includes both lockfiles,
    # so a dependency bump starts a fresh entry and anything else restores the previous
    # snapshot by prefix; `purge` deletes the superseded entries at save time, which is
    # what keeps the two groups' entries from crowding each other out of the budget.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ inputs.cache-group }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
        restore-prefixes-first-match: nix-${{ inputs.cache-group }}-
        save: ${{ inputs.cache-save }}
        gc-max-store-size-linux: ${{ inputs.cache-gc-size }}
        purge: ${{ inputs.cache-save }}
        purge-prefixes: nix-${{ inputs.cache-group }}-
        purge-created: 0
        purge-primary-key: never
