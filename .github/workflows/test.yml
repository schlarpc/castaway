name: Test

on:
  pull_request:
  # `main` only: work lands there directly (ground rule 10), and the one other kind of
  # branch this repo sees is dependabot's — which already runs as a pull_request, so the
  # unrestricted push trigger ran its whole matrix twice.
  push:
    branches: [main]
  # Nightly, for the checks worth having regularly but not per commit (coverage).
  schedule:
    - cron: "20 9 * * *"

# Coalesce to the tip. A push that lands while an older one is still building makes the
# older run irrelevant, and these jobs are long enough that letting both finish wastes a
# lot of runner time.
#
# `main` used to be exempt, on the theory that there every commit's result is worth having
# on its own. It never bought that. `cancel-in-progress: false` protects a run that has
# *started*; it does nothing for one that is still pending, because a concurrency group
# holds at most one pending run and each new push evicts the queued one. Ten of the last
# twenty main runs were cancelled while pending, having built nothing — and `main` stayed
# red for four commits with no completed run anywhere to say so (#334).
#
# So the exemption delivered the opposite of its intent: the runner time went to whichever
# stale commit happened to be in flight, and the tip — the one commit anybody was waiting
# on — was the one reliably evicted. Coalescing inverts that. The last push of a burst is
# never superseded, so the tip always runs to completion, and the nightly below re-tests
# the tip unconditionally, so a gap closes within a day instead of never.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that is a mistake in the flake rather than in the code, found in a minute
  # instead of ninety: forcing every check to a derivation runs all of its evaluation, so a
  # guard that throws — a version-agreement assertion between a pinned blob and nixpkgs,
  # say — fires here rather than at the end of an hour-long build. One did exactly that to
  # a dependabot PR, having been knowable at the start of the run.
  #
  # `nix flake check --no-build` is the obvious way to write this and does not work: this
  # flake needs import-from-derivation to evaluate (crane vendors sources *through* a
  # derivation), and `--no-build` refuses to realise it — "error: path
  # '…-source.drv' is not valid". It passes on a warm store and fails on a cold runner,
  # which is the worst way for a gate to be wrong.
  #
  # The same step enumerates the checks for the matrix below, so the two cannot drift: a
  # check added to `flake.nix` becomes a job here, and nobody has to remember to list it.
  discover:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/nix-runner
      - id: list
        run: |
          nix eval --raw .#checks.x86_64-linux --apply \
            'cs: builtins.concatStringsSep "\n" (map (c: c.drvPath) (builtins.attrValues cs))'
          echo
          checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          # Coverage re-compiles the workspace instrumented and re-runs the whole suite —
          # 70+ minutes for a number nothing gates on per commit, and its test verdict is
          # `test`'s verdict. Per-commit runs drop it; the nightly keeps it (#238).
          #
          # The nightly runs the *whole* matrix, not coverage alone as it used to. That is
          # the other half of coalescing: leaving only the tip tested is the intent, but it
          # is sound only if something re-tests the tip no matter what happened during the
          # burst. This is that something — and it is also what lets a commit whose own run
          # was superseded still reach the Latest release pointer, through `promote` (#334).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            checks=$(echo "$checks" | jq -c 'map(select(. != "coverage"))')
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "$checks"

  # There is deliberately no cache-warming build job in front of the matrix any more.
  # There was one, on the theory that it turns N full builds into N mostly-cached ones —
  # and the measurement said otherwise: the Actions cache sits at its 10 GB eviction
  # ceiling with ~9k entries, and `check (build)` rebuilt the *same derivation* the
  # warming job had just built, from scratch, for 83 minutes. The premise costs 53
  # minutes of critical path in front of every matrix and delivers nothing the per-job
  # cache restore does not; the artifact itself is still built, as `check (build)`
  # (#238).

  # One job per check, which buys two things.
  #
  # It is the disk fix that keeps working as the project grows: each check gets a whole
  # runner rather than sharing one with twenty others, so what broke here cannot come back
  # by accretion.
  #
  # And it is a legible result. `nix flake check` in a single step produced one red X and
  # a log that stopped mid-build; this names the check that failed, and `fail-fast: false`
  # means a red `clippy` no longer hides whether the VM tests would have passed.
  check:
    needs: [discover]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    name: check (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/nix-runner
        with:
          # The windows cross tree is a disjoint closure and gets its own snapshot; the
          # saver for each group is the job whose store contains the group's biggest
          # rebuild cost — `test` holds the crane dependency tree everything Rust-shaped
          # restores, the dll closure holds the MSVC/ffmpeg cross tree the Release
          # workflow restores. Saves happen only on pushes to main: a PR's store belongs
          # to the PR, and every extra saver is a multi-GB entry in a 10 GB budget.
          # By prefix rather than by name: every `castaway-windows-*` check shares the
          # cross closure, and naming them one at a time is how the second one comes to
          # rebuild the whole MSVC/ffmpeg tree from scratch without anyone noticing.
          cache-group: ${{ startsWith(matrix.check, 'castaway-windows-') && 'windows' || 'main' }}
          cache-save: ${{ (matrix.check == 'test' || matrix.check == 'castaway-windows-electron-dll-closure') && github.event_name == 'push' }}
          cache-gc-size: ${{ startsWith(matrix.check, 'castaway-windows-') && '6G' || '12G' }}
      - run: .github/scripts/nix-build.sh '.#checks.x86_64-linux.${{ matrix.check }}'
      - uses: ./.github/actions/postmortem
        if: failure()

  # The Latest release pointer — the one thing in this repo that claims a commit was good.
  #
  # Every commit on `main` publishes its Windows zip the moment it cross-builds, as a
  # *prerelease* (Release workflow). This job takes that release out of prerelease and
  # marks it Latest once the whole matrix has agreed, so what a download-the-latest link
  # hands the panel is the newest commit CI validated, not the newest commit that merely
  # compiled. Artifacts stay per-commit either way; it is only the pointer that waits.
  #
  # Two invariants, and the second is the one with teeth:
  #
  #   * Only green commits are promoted — `success()` here means every job in the matrix
  #     passed, `fail-fast: false` notwithstanding.
  #   * The pointer never moves backwards. Runs finish out of order all the time: a
  #     nightly re-testing a tip that a push has since moved past, a superseded run
  #     beating its successor to the line. A bare `--latest` would happily walk Latest
  #     back onto an ancestor, so the ancestry check below is what actually holds the
  #     ordering rule. Note it is a *check*, not a lock: serialising this with a
  #     concurrency group would drop pending runs, which is #334 again on the one stream
  #     that must not have gaps.
  promote:
    needs: [check]
    if: ${{ success() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      # As in the Release workflow, and for the same reason: editing a release is a write
      # to this repository's contents.
      contents: write
      # Reading the build provenance before the pointer moves.
      attestations: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # `git merge-base --is-ancestor` needs real history and the release tags. The
          # default shallow clone has one commit and no tags, and would answer every
          # ancestry question wrong rather than failing.
          fetch-depth: 0
      - name: Move Latest onto this commit, if it is ahead of the current one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short "$GITHUB_SHA")
          tag="build-$short"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the matrix is green for $short but no $tag release exists, so" \
                 "the Release workflow failed to publish an artifact for it. Latest stays."
            exit 1
          fi

          # GitHub's own answer for Latest: the newest release that is neither draft nor
          # prerelease, which under this scheme means the newest commit a run promoted.
          # 404s on a repo where nothing has been promoted yet, hence the `|| true`.
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$tag" ]; then
            # `^{commit}` so this reads the same for a lightweight tag (what `gh release
            # create` makes) and an annotated one (what a human would make by hand).
            if ! current_sha=$(git rev-parse -q --verify "refs/tags/$current^{commit}"); then
              echo "::error::Latest is $current, which does not resolve in this checkout;" \
                   "refusing to move the pointer without knowing what it points at."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current_sha" "$GITHUB_SHA"; then
              echo "Latest is $current, which is not an ancestor of $short — this run" \
                   "finished out of order. Leaving the pointer where it is."
              exit 0
            fi
          fi

          # Provenance, checked before the pointer moves. `promote` is the one job in this
          # repository that claims a commit is good, and the panel does nothing but follow
          # the pointer it sets — so this is where "GitHub itself vouched for these bytes"
          # belongs. The receiver does not link a Sigstore client *yet* — that is a cost
          # question rather than a blocked one (D59: 35 packages, ~14 MB, and a second
          # crypto provider beside `ring`), and this gate is what covers the gap meanwhile.
          #
          # The **zip**, not `manifest.json`. The manifest is the tempting subject — it is
          # 240 bytes and it carries the zip's digest — but it only exists when a release
          # signing key did, before D59 removed that key entirely — and gating the Latest
          # pointer on an optional asset is how it stops moving for ever. The zip
          # is what every release has and is what the panel installs, so it is the honest
          # subject anyway. It is a fast download between two GitHub hosts.
          gh release download "$tag" --pattern '*.zip' --dir attest --clobber
          if ! gh attestation verify attest/*.zip \
                 --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
            echo "::error::$tag has no verifiable build provenance, so Latest stays where" \
                 "it is. Either the Release workflow did not attest it (a release published" \
                 "before #26's attestation step), or something other than release.yml on" \
                 "this repository produced that artifact — which is the case this check" \
                 "exists for."
            exit 1
          fi

          # Both halves: out of prerelease, because it has now been validated, and onto
          # Latest. `--latest` is explicit rather than date-inferred, which matters here
          # precisely because a newer prerelease usually already exists.
          gh release edit "$tag" --prerelease=false --latest
          echo "Latest is now $tag${current:+ (was $current)}"
