name: Test

on:
  pull_request:
  # `main` only: work lands there directly (ground rule 10), and the one other kind of
  # branch this repo sees is dependabot's — which already runs as a pull_request, so the
  # unrestricted push trigger ran its whole matrix twice.
  push:
    branches: [main]
  # Nightly, for the checks worth having regularly but not per commit (coverage).
  schedule:
    - cron: "20 9 * * *"

# A push that lands while the previous one is still building makes the older run
# irrelevant, and these jobs are long enough that letting both finish wastes a lot of
# runner time. Not on `main`: there, every commit's result is worth having on its own.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything that is a mistake in the flake rather than in the code, found in a minute
  # instead of ninety: forcing every check to a derivation runs all of its evaluation, so a
  # guard that throws — a version-agreement assertion between a pinned blob and nixpkgs,
  # say — fires here rather than at the end of an hour-long build. One did exactly that to
  # a dependabot PR, having been knowable at the start of the run.
  #
  # `nix flake check --no-build` is the obvious way to write this and does not work: this
  # flake needs import-from-derivation to evaluate (crane vendors sources *through* a
  # derivation), and `--no-build` refuses to realise it — "error: path
  # '…-source.drv' is not valid". It passes on a warm store and fails on a cold runner,
  # which is the worst way for a gate to be wrong.
  #
  # The same step enumerates the checks for the matrix below, so the two cannot drift: a
  # check added to `flake.nix` becomes a job here, and nobody has to remember to list it.
  discover:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/nix-runner
      - id: list
        run: |
          nix eval --raw .#checks.x86_64-linux --apply \
            'cs: builtins.concatStringsSep "\n" (map (c: c.drvPath) (builtins.attrValues cs))'
          echo
          checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          # Coverage re-compiles the workspace instrumented and re-runs the whole suite —
          # 70+ minutes for a number nothing gates on per commit, and its test verdict is
          # `test`'s verdict. Nightly is enough; per-commit runs drop it (#238).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            checks='["coverage"]'
          else
            checks=$(echo "$checks" | jq -c 'map(select(. != "coverage"))')
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "$checks"

  # There is deliberately no cache-warming build job in front of the matrix any more.
  # There was one, on the theory that it turns N full builds into N mostly-cached ones —
  # and the measurement said otherwise: the Actions cache sits at its 10 GB eviction
  # ceiling with ~9k entries, and `check (build)` rebuilt the *same derivation* the
  # warming job had just built, from scratch, for 83 minutes. The premise costs 53
  # minutes of critical path in front of every matrix and delivers nothing the per-job
  # cache restore does not; the artifact itself is still built, as `check (build)`
  # (#238).

  # One job per check, which buys two things.
  #
  # It is the disk fix that keeps working as the project grows: each check gets a whole
  # runner rather than sharing one with twenty others, so what broke here cannot come back
  # by accretion.
  #
  # And it is a legible result. `nix flake check` in a single step produced one red X and
  # a log that stopped mid-build; this names the check that failed, and `fail-fast: false`
  # means a red `clippy` no longer hides whether the VM tests would have passed.
  check:
    needs: [discover]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    name: check (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/nix-runner
      - run: .github/scripts/nix-build.sh '.#checks.x86_64-linux.${{ matrix.check }}'
      - uses: ./.github/actions/postmortem
        if: failure()
