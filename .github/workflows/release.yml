name: Release

# Every commit on `main` becomes a release named for it, carrying the one artifact anyone
# deploys: `castaway-windows-electron.zip` (docs/cross-build.md §4). The panel's Windows
# box has no Nix store and no toolchain — a zip on a release page is the whole delivery
# mechanism, and naming the release after the commit is what ties the bits on the panel
# back to the tree they came from.
#
# Deliberately not gated on the Test workflow: the full check matrix takes upwards of two
# hours, and the cross-build neither runs those tests nor shares their failure modes. A
# broken commit produces a release the same as a good one — the release records what
# `main` was, not that it was good.
#
# But "not gated" is not the same as "indistinguishable", and it used to be. Every release
# was published as Latest by virtue of being newest, so the default download was whatever
# had most recently *compiled*, on a tree whose test matrix had been red for four commits
# without anyone noticing (#334). So the two claims are now separated:
#
#   * this workflow publishes every commit, as a **prerelease** — the artifact exists, and
#     the badge says nothing has vouched for it;
#   * the Test workflow's `promote` job clears the prerelease flag and moves **Latest**,
#     once its whole matrix is green and only ever forwards along the commit graph.
#
# Which makes Latest mean "the newest commit CI validated" and keeps every commit
# downloadable for a panel-side bisect. It also means Latest can sit several commits
# behind the tip, and that is the honest reading rather than a defect.
#
# Since #343 each release also carries `manifest.json`, and since D59 that manifest is
# authenticated by GitHub's own build provenance rather than by a signature of ours. The
# panel follows Latest unattended, and two things it cannot work out for itself live in
# that file: whether the release is *newer* than the one running (a sha identifies a tree,
# it does not order two of them) and whether the bytes are the ones this repository built
# (TLS authenticates the host, not the artifact).
#
# The provenance is the stronger half of that, and it is why there is no signing secret
# here any more: forging it requires a visible commit to *this file* on this repository,
# rather than reading a secret any workflow could have read.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # Job level rather than step level, because a step's `if:` reads the *job's*
    # environment: `env.EVS_ACCOUNT_NAME != ''` below is how the EVS install is skipped on
    # a repository that has no castLabs account, and a step-scoped variable would be
    # invisible to it.
    env:
      # The Authenticode certificate, base64 of a PKCS#12, and its password (#344).
      CASTAWAY_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
      CASTAWAY_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      # castlabs-evs reads these itself, from the environment, in both its account and its
      # vmp module — so `vmp-sign.sh` needs no arguments and no cached login. `EVS_NO_ASK`
      # is what keeps `sign-pkg` from stopping at a confirmation prompt on a runner with
      # no tty.
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      EVS_NO_ASK: "1"
    permissions:
      # The OIDC token `attest-build-provenance` exchanges with Fulcio for a short-lived
      # signing certificate. Already requested before this — the Nix installer uses it too.
      id-token: write
      # Storing the provenance attestation against this repository.
      attestations: write
      # The one departure from the Test workflow's read-only stance: creating the release
      # and uploading the zip is a write to this repo's contents.
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The whole history, because the release carries a **build number** and that
          # number is `git rev-list --count` (#343). The default shallow checkout has one
          # commit, so it would answer 1 — and a panel that had already installed a real
          # build would then read every future release as a downgrade and stop updating,
          # silently and permanently. `nix build` reads `self.revCount` off the same
          # history for the number it stamps into the binary, so both halves of the
          # ordering depend on this line.
          fetch-depth: 0
      - uses: ./.github/actions/nix-runner
        with:
          # The cross tree's snapshot; saved by the Test workflow's dll-closure check,
          # restored here, so the two windows builds stop paying for the toolchain twice.
          cache-group: windows
      # `.archive` rather than the bare package: the package is the deploy *tree*, and
      # the archive derivation is that tree as one reproducible zip (stable mtimes, sorted
      # entries) — the thing a release asset should be.
      - run: .github/scripts/nix-build.sh '.#castaway-windows-electron.archive'
      # The castLabs EVS client, which signs the Electron tree for a verified media path
      # (#344). pip rather than nixpkgs because there is no nixpkgs package, and because
      # this is deliberately outside the derivation anyway: EVS is a network service that
      # signs exact bytes, so it can be neither reproducible nor credential-free.
      #
      # `--user` so `python3 -m castlabs_evs` — which is how `vmp-sign.sh` invokes it —
      # finds it with no activation step, and so nothing here has to know where the
      # runner's python lives.
      - name: Install the castLabs EVS client
        if: ${{ env.EVS_ACCOUNT_NAME != '' }}
        run: pip install --user castlabs-evs
      - name: Assemble the release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short "$GITHUB_SHA")
          # The sha in the asset's own filename, so a Downloads folder with three of them
          # still says which is which.
          zip="castaway-windows-electron-$short.zip"

          # Signing comes first, because everything downstream describes the *signed*
          # bytes: the manifest's digest, and the asset the panel downloads. Authenticode
          # on our executables, then castLabs VMP over the Electron tree, then a re-zip —
          # so the release asset no longer hash-matches the store zip, and the signed
          # manifest is what binds its bytes instead.
          if [ -n "${CASTAWAY_CODESIGN_PFX:-}" ] && [ -n "${EVS_ACCOUNT_NAME:-}" ]; then
            nix run '.#sign-windows' -- "result/castaway-windows-electron.zip" "$zip"
          else
            # Loud, not fatal — same call as the manifest below. The thing this guards
            # against is a *silent* unsigned release, because an artifact with no .sig
            # files plays fine against Widevine UAT and fails against production, which
            # is a failure nobody sees until they are standing in front of the panel.
            echo "::error::no WINDOWS_CODESIGN_PFX / EVS_ACCOUNT_NAME secrets, so this" \
                 "release is neither Authenticode- nor VMP-signed. Installing it on the" \
                 "panel would strip the .sig files and kill DRM playback (#344)."
            cp "result/castaway-windows-electron.zip" "$zip"
          fi
          assets=("$zip")

          # The manifest an unattended panel needs (#343): the monotonic build number that
          # orders this release against the one already installed, and the zip's digest and
          # size. Unconditional, and carrying no signature of its own — the attestation
          # step below covers it, and that is what the receiver verifies (D59).
          #
          # It matters that this is the *small* file. Attestations are keyed by artifact
          # digest, so a panel that verified the zip directly would have to download 250 MB
          # before it could ask whether the bytes were genuine, with nothing trustworthy to
          # bound the download by. Verifying the 240-byte manifest first yields the digest
          # and the size, and the zip is then fetched against both.
          build=$(git rev-list --count "$GITHUB_SHA")
          nix run '.#release-manifest' -- "$zip" "$GITHUB_SHA" "$build" .
          assets+=(manifest.json)

          # Handed to the next two steps as one line, because the attestation has to cover
          # exactly the bytes the release will carry — naming them twice is how the two
          # come to disagree.
          # One per line: `subject-path` takes a newline-separated list, and the publish
          # step's `read -a` splits on newlines too, so one output serves both without
          # either having to know how the other quotes.
          {
            echo "short=$short"
            echo "assets<<ASSET_LIST"
            printf '%s\n' "${assets[@]}"
            echo "ASSET_LIST"
          } >> "$GITHUB_OUTPUT"

      # Provenance, from GitHub's own machinery: a Sigstore bundle signed with a
      # short-lived certificate bound to *this workflow's* identity, and logged in the
      # public Rekor transparency log. No secret exists for anyone to steal, and the
      # forgery a signing secret cannot stop — someone with write access swapping a
      # release asset — becomes a visible commit to this file rather than a silent swap.
      #
      # `gh attestation verify castaway-windows-electron-<sha>.zip --repo schlarpc/castaway`
      # is the whole verification story for a human or a CI gate.
      #
      # The panel does *not* check this, and that is a decision rather than an oversight:
      # the Rust Sigstore client links 326 packages including a second HTTP stack and a
      # browser launcher, against 113 for the whole updater today. What the panel checks
      # is in `crates/update`.
      #
      # Between assembling and publishing, so a release only exists once its provenance
      # does. A failure here is a failed job and no release, which is the right way round.
      - name: Attest what this workflow built
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.assets }}

      - name: Publish the commit-named release
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.assets.outputs.short }}
          ASSETS: ${{ steps.assets.outputs.assets }}
        run: |
          set -euo pipefail
          short="$SHORT"
          read -r -a assets <<< "$ASSETS"
          # `build-<sha>` rather than the bare sha: a tag that *is* a commit id shadows
          # the commit in every ref-vs-object ambiguity git and the API have.
          # `--prerelease` and `--latest=false` are the same claim twice, deliberately.
          # The prerelease flag is what keeps this release out of GitHub's `releases/latest`
          # — that exclusion is defined behaviour, where relying on `make_latest` alone
          # would leave the pointer to a date heuristic. `--latest=false` then says it
          # again for the one API that reads it. `promote` in the Test workflow clears
          # both, for green commits only, in commit order.
          gh release create "build-$short" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "castaway $short" \
            --notes "$(git log -1 --format='%s%n%n%H')" \
            "${assets[@]}"
      - uses: ./.github/actions/postmortem
        if: failure()
