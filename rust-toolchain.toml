# Single source of truth for the Rust toolchain.
#
# - Nix reads this via `rust-bin.fromRustupToolchainFile` in flake.nix, so the
#   exact build is still pinned/reproducible through rust-overlay in flake.lock.
# - Non-Nix users with rustup get the identical version automatically.
#
# To upgrade Rust: bump `channel` here (optionally `nix flake update` rust-overlay
# so the new version is available), then commit. Nix follows this file.
[toolchain]
channel = "1.96.1"
profile = "default"
components = ["rust-src", "rust-analyzer", "llvm-tools-preview"]
# The Windows deploy target (docs/cross-build.md). MSVC rather than MinGW: windows-rs
# expects MSVC and the vendored import libs are MSVC-format. The matching CRT/SDK sysroot
# comes from nix/msvc-sysroot.nix; nix/windows.nix wires clang-cl + lld-link around it.
targets = ["x86_64-pc-windows-msvc"]
