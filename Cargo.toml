[workspace]
resolver = "2"
# Explicit list (not a `crates/*` glob): crane's dependency-only build generates a
# dummy source tree from this list, and it does not expand globs. Add each crate here
# as it lands.
members = [
    "crates/core",
    "crates/paths",
    "crates/substrate-hci",
    "crates/substrate-l2cap",
    "crates/substrate-sdp",
    "crates/proto-bluetooth-audio",
    "crates/hci-transport",
    "crates/substrate-ssdp",
    "crates/proto-dlna",
    "crates/substrate-mdns",
    "crates/proto-cast",
    "crates/proto-spotify",
    "crates/crypto-cast-auth",
    "crates/cast-replay",
    "crates/cast-registry",
    "crates/substrate-rtp",
    "crates/substrate-rtsp",
    "crates/crypto-fairplay",
    "crates/crypto-raop",
    "crates/crypto-playfair",
    "crates/proto-airplay",
    "crates/proto-dial",
    "crates/proto-miracast",
    "crates/proto-matter",
    "crates/moonlight-sys",
    "crates/ldac-sys",
    "crates/proto-gamestream",
    "crates/sponsorblock",
    "crates/pipeline",
    "crates/control-display",
    "crates/input-touch",
    "crates/app",
]

# Crane reads this to name the workspace build (the root manifest is virtual).
[workspace.metadata.crane]
name = "castaway"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.96"
repository = "https://github.com/schlarpc/castaway"

# Shared dependency versions. Individual crates opt in with `foo.workspace = true`.
[workspace.dependencies]
# --- internal crates ---
castaway-core = { path = "crates/core" }
castaway-paths = { path = "crates/paths" }
substrate-mdns = { path = "crates/substrate-mdns" }
substrate-ssdp = { path = "crates/substrate-ssdp" }
substrate-rtsp = { path = "crates/substrate-rtsp" }
substrate-hci = { path = "crates/substrate-hci" }
substrate-l2cap = { path = "crates/substrate-l2cap" }
substrate-sdp = { path = "crates/substrate-sdp" }
proto-bluetooth-audio = { path = "crates/proto-bluetooth-audio" }
hci-transport = { path = "crates/hci-transport" }
substrate-rtp = { path = "crates/substrate-rtp" }
crypto-cast-auth = { path = "crates/crypto-cast-auth" }
cast-replay = { path = "crates/cast-replay" }
cast-registry = { path = "crates/cast-registry" }
crypto-fairplay = { path = "crates/crypto-fairplay" }
crypto-raop = { path = "crates/crypto-raop" }
crypto-playfair = { path = "crates/crypto-playfair" }
proto-dlna = { path = "crates/proto-dlna" }
proto-cast = { path = "crates/proto-cast" }
proto-airplay = { path = "crates/proto-airplay" }
proto-dial = { path = "crates/proto-dial" }
proto-miracast = { path = "crates/proto-miracast" }
proto-matter = { path = "crates/proto-matter" }
moonlight-sys = { path = "crates/moonlight-sys" }
ldac-sys = { path = "crates/ldac-sys" }
# Same, for the same reason: its default is `stream`, which links moonlight-common-c.
# `castaway`'s `gamestream` feature turns it back on.
proto-gamestream = { path = "crates/proto-gamestream", default-features = false }
proto-spotify = { path = "crates/proto-spotify" }
sponsorblock = { path = "crates/sponsorblock" }
# `default-features = false` matters now that the default set is everything (D55): a
# dependent that wants a lean build — `castaway-portable`, the VM fixture — passes
# `--no-default-features` for *itself*, which does nothing about its dependencies' own
# defaults. Without this line portable still pulled wgpu, ffmpeg, cpal and pipewire, and
# failed on alsa-sys. `crates/app` turns on exactly what it needs through its own
# features (`render` → `pipeline/kiosk,ffmpeg,stream,remote`, and so on), so the full
# default build is unchanged.
pipeline = { path = "crates/pipeline", default-features = false }
control-display = { path = "crates/control-display" }
input-touch = { path = "crates/input-touch" }

# --- async / runtime ---
tokio = { version = "1.43", default-features = false }
tokio-util = "0.7"
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
# A WebSocket *client*, for tests that dial the receiver platform the way a page does.
tokio-tungstenite = "0.28"

# --- cli ---
# `env` so `--config` and `$CASTAWAY_CONFIG` are one code path with one precedence rule.
clap = { version = "4", features = ["derive", "env"] }

# --- error / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rotated on-disk logs for the unattended panel. Used synchronously (no `non_blocking`
# worker) so an aborting process does not take its own last lines with it.
tracing-appender = "0.2"

# --- serialization / wire ---
bytes = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
prost-build = "0.13"

# --- networking / discovery ---
mdns-sd = "0.20"
# Blocking HTTP, used off-runtime via spawn_blocking (EasyList; the Lounge screen lookup).
ureq = "2"
# Scriptlet resources in tests, and the CKS response fields, which arrive base64
# over a fixed keystream.
base64 = "0.23"
axum = "0.8"
webrtc = "0.20"
hyper = "1"
rtsp-types = "0.1"
plist = "1"
# AirServer's live credential endpoint answers with a whole SQLite database, so one
# has to be read. `bundled` compiles the amalgamation rather than hunting for an
# MSVC import library — the workspace already ships C into the Windows artifact
# (moonlight-common-c, enet, libcrypto), so this is not a new kind of dependency.
# Read-only, and only ever pointed at a file we just wrote ourselves.
rusqlite = { version = "0.40", features = ["bundled"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# --- tls ---
# `ring` everywhere, explicitly: it is the backend that already cross-compiles for the
# Windows target in nix/windows.nix, and rcgen/rustls each default to aws-lc-rs, which
# would drag a second C crypto build into the tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# Certificate validity windows. Present transitively via rcgen; named here because
# `proto-cast` and `crypto-cast-auth` set `notBefore`/`notAfter` deliberately rather
# than taking rcgen's 1975→4096 default (see `TlsIdentity` for why that matters).
time = { version = "0.3", default-features = false, features = ["std"] }

# --- crypto ---
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
# `getrandom`, because 3.0 moved to rand_core 0.10 and rand_core 0.10 has no `OsRng` —
# seeding an ephemeral key from the OS is the crate's own job now, not a caller's.
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
aes = "0.8"
ctr = "0.9"
# AirPlay 1 audio is AES-128-CBC; Cast mirroring is CTR. Both, deliberately named.
cbc = "0.1"
rsa = { version = "0.9", features = ["sha2", "sha1"] }
sha2 = "0.10"
sha1 = "0.10"
# Only for the CKS `sig` query parameter, whose shape is the backend's choice
# (MD5 of a constant and a timestamp). Nothing here relies on it for security.
md-5 = "0.10"
# Opening AirServer's credential database, whose every BLOB is a libsodium
# `crypto_secretbox` (XSalsa20-Poly1305) under a BLAKE2b-derived key.
#
# `blake2b_simd` rather than RustCrypto's `blake2` because libsodium's
# `crypto_generichash_blake2b_salt_personal` sets the BLAKE2b parameter block's
# *salt* and *personal* fields, and the `blake2` API does not expose them.
blake2b_simd = "1"
# XSalsa20-Poly1305, i.e. NaCl `crypto_secretbox`. A pre-release is the only
# published version, but it is RustCrypto's own implementation of a frozen
# construction, which beats composing salsa20 + poly1305 by hand here.
crypto_secretbox = "0.2.0-pre.0"
hmac = "0.12"
hkdf = "0.12"
rand = "0.10"

# --- matter ---
# The Matter core, linked rather than reimplemented (DECISION-LOG D54): TLV, MRP,
# PASE/CASE both ways round, the interaction model, and the certificate handling, plus
# every cluster in the CSA 1.5.1 IDL generated at build time — the media clusters among
# them. Apache-2.0, pure Rust, and maintained by project-chip, who also write the spec.
#
# Default features less `os`: that one exists to hand the crate a smol reactor, its own
# UDP sockets and its own mDNS responder, and this project has exactly one of each
# already (D26/D45). `embassy-time` and `critical-section` are named directly because
# `os` is where they would otherwise have picked up their `std` implementations, and
# without those the MRP retransmit timer has no clock.
rs-matter = { version = "0.2", default-features = false, features = ["std", "rustcrypto", "log"] }
embassy-time = { version = "0.5", features = ["std"] }
critical-section = { version = "1.1", features = ["std"] }
# The timer queue behind `embassy-time`. Without it the default is the one the embassy
# *executor* provides, which this project does not run — and the symptom is a link error
# (`__embassy_time_queue_item_from_waker`), not a compile error.
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }

# --- spotify ---
# The one protocol we do NOT reimplement (DECISION-LOG D30). Spotify Connect is a cloud
# service that changes unilaterally — login5 replaced password auth, the dealer replaced
# Mercury, keymaster started 403ing — so owning the wire here buys a maintenance treadmill
# rather than a durable asset. `rustls-tls-webpki-roots` keeps the cross-build off OpenSSL;
# `default-features = false` keeps librespot's own audio backends out, because the Sink is
# ours (crates/proto-spotify/src/sink.rs).
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"

# --- dev / test ---
hex-literal = "0.4"
tokio-test = "0.4"
tempfile = "3"
# Reads back the certificates we issue, so the tests assert on the DER a sender parses
# rather than on the parameters we handed rcgen. Also a runtime dependency of
# `cast-replay`, which takes a credential's validity window from the certificate itself.
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
enum_glob_use = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 0
debug = true

# `mdns-sd`, plus the one capability it does not have: several DNS-SD sub-types on one
# service instance (#227). Upstream's `ServiceInfo` holds a single `Option<String>` and
# its registry is keyed by a fullname with the sub-type stripped, so registering an
# instance under N sub-types silently keeps only the last — every `register()` returning
# Ok while six of seven records never reach the wire. That is fatal here: Play Services
# matches a discovered device to its filter criteria out of the sub-types in the mDNS
# answer alone, so each unserved one is a picker this panel is invisible to (#226).
#
# The patch is additive and backwards-compatible — `sub_domains: Vec<String>` beside the
# existing `sub_domain`, which stays the first of them, so every existing accessor keeps
# its meaning — and is kept as `vendor/mdns-sd.patch` so an upstream bump is re-apply
# rather than re-derive. Nobody has reported this upstream (the closest is
# keepsimple1/mdns-sd#145, the browse half of the same root cause), so it is offered
# rather than owned: the fork exists to be deleted.
[patch.crates-io]
mdns-sd = { path = "vendor/mdns-sd" }
