[package]
name = "proto-bluetooth-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A2DP sink (AVDTP) and AVRCP: all five codecs, track metadata, transport control, and cover art."

[dependencies]
castaway-core.workspace = true
substrate-rtp.workspace = true
substrate-hci.workspace = true
substrate-l2cap.workspace = true
substrate-sdp.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
bytes.workspace = true
quick-xml.workspace = true
tracing.workspace = true

[dev-dependencies]
hex-literal.workspace = true
tokio = { workspace = true, features = [
    "signal",
    "sync",
    "rt",
    "macros",
    "time",
    "rt-multi-thread",
    # `start_paused`: the command watchdog is a five-second deadline, and a test that
    # waits five real seconds for it is a test nobody runs.
    "test-util",
] }
# For the two examples only: they drive the real stack against a controller, which needs
# a transport. Nothing in the library depends on it. `socket` is a no-op off Linux (the
# module is `cfg(target_os = "linux")`), and `ertm_echo` says so for itself.
hci-transport = { workspace = true, features = ["socket", "usb"] }
tracing-subscriber.workspace = true

[features]
# `ldac` on by default (D55) — and as of #210 there is nothing else here.
#
# There used to be a `bench` feature holding these two examples back, on the reasoning
# that they want a dongle and `sudo` and CI does not have either. What it actually did
# was keep ~600 lines out of `clippy --all-targets` and out of every build: `ertm_echo`
# is the *only* thing in this tree that has ever put our ERTM engine in front of a
# foreign L2CAP, and it was one bit-rotted line away from not compiling at any time. That
# is exactly the shape D55 was written about. Wanting hardware is a reason not to *run*
# something in CI; it was never a reason not to compile it — and `checks.bluetooth-vm`
# now runs `ertm_echo` anyway, against `btvirt`, with no hardware at all (#210).
default = ["ldac"]
# Advertise the LDAC endpoint. Still gated, because advertising a codec we cannot decode
# is worse than omitting it: the sender picks it and the session is silence (#14). What
# changed is that there is now something to gate — `pipeline/ldac` links Sony's own
# library — and the app keeps the two in step by deriving `decodable` from what the
# pipeline reports rather than from this flag. This only sets the default for a caller
# that builds a `BluetoothConfig` without asking.
ldac = []

[lints]
workspace = true
