[package]
name = "proto-bluetooth-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A2DP sink (AVDTP) and AVRCP: all five codecs, track metadata, transport control, and cover art."

[dependencies]
castaway-core.workspace = true
substrate-rtp.workspace = true
substrate-hci.workspace = true
substrate-l2cap.workspace = true
substrate-sdp.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
bytes.workspace = true
tracing.workspace = true

[dev-dependencies]
hex-literal.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
# For the ERTM bench only: it drives the real engine against the Linux kernel's L2CAP
# through a virtual controller, which needs a transport. Nothing in the library depends
# on it, and the example is gated so a non-Linux build never reaches for it.
hci-transport = { workspace = true, features = ["socket"] }
tracing-subscriber.workspace = true

[[example]]
name = "ertm_echo"
required-features = ["bench"]

[features]
default = []
# Build the benches that need a controller. Off by default: they are Linux-only and
# exist to be run by hand against `btvirt`, not by CI.
bench = []
# Advertise the LDAC endpoint. Still gated, because advertising a codec we cannot decode
# is worse than omitting it: the sender picks it and the session is silence (#14). What
# changed is that there is now something to gate — `pipeline/ldac` links Sony's own
# library — and the app keeps the two in step by deriving `decodable` from what the
# pipeline reports rather than from this flag. This only sets the default for a caller
# that builds a `BluetoothConfig` without asking.
ldac = []

[lints]
workspace = true
