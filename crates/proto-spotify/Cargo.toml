[package]
name = "proto-spotify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Spotify Connect zeroconf onboarding: _spotify-connect._tcp advertisement, getInfo/addUser, and the DH pairing + blob decryption (librespot-compatible)."

[dependencies]
castaway-core.workspace = true
substrate-mdns.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
num-bigint = "0.5"
num-traits = "0.2"
sha1.workspace = true
hmac.workspace = true
pbkdf2 = { version = "0.12", features = ["hmac"], default-features = false }
aes.workspace = true
ctr.workspace = true
base64 = "0.23"
rand.workspace = true
# Not for a config of ours — this crate builds none. It is here to install the process
# default provider librespot's HTTP client needs and does not name (`install_crypto_provider`).
rustls.workspace = true
librespot-core.workspace = true
librespot-connect.workspace = true
librespot-playback.workspace = true
librespot-metadata.workspace = true
librespot-protocol.workspace = true
futures.workspace = true
# Cover-art fetches ride librespot's own HTTP client, which speaks `http` types — so no
# second TLS stack or connection pool for the sake of one GET per track.
http = "1"
bytes.workspace = true

[dev-dependencies]
# The shared deadline poll (#236).
castaway-test-support.workspace = true
hex-literal.workspace = true
# `test-util` for `start_paused`: the reconnect loop's give-up path takes 366 seconds of
# backoff, and the test asserts against the intervals the panel ships with rather than
# against shortened ones (#199).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
# For the `selfplay` harness only — the scripted controller talks to Spotify's Web API.
# `rustls-tls-webpki-roots` for the same reason the runtime crates use it: no OpenSSL.
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
