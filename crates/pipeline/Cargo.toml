[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Media pipeline: the null (log) backend used for daily dev, plus the Compositor/Decoder/Browser trait surfaces the ffmpeg + wgpu + Electron backends slot behind feature flags."

[dependencies]
castaway-core.workspace = true
# One answer to "which directory?", shared with the app (the filter-list cache).
castaway-paths.workspace = true
# The InputSink/TouchEvent/PointerEvent interface: the kiosk routes window input to the
# focused surface (the Electron browser today) through it.
input-touch.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "process", "io-util"] }
bytes.workspace = true
# Unconditional: `browser_proto` is the browser subprocess wire format (D36) and is
# compiled in every build, so its round-trip tests run everywhere rather than only where
# a browser backend exists.
serde = { workspace = true }
serde_json = { workspace = true }

# --- real render backends (optional deps, in the default feature set since D55;
# windows.nix opts out and names its own. DECISION-LOG D4) ---
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
ffmpeg-next = { version = "7.1", optional = true }
# Raw libav for the hwaccel path: `ffmpeg-next` 7.1 wraps none of `hw_device_ctx`,
# `get_format`, or `AVHWFramesContext`, so those go through the -sys crate it already
# depends on (same version, so there is only ever one libav binding in the tree).
ffmpeg-sys-next = { version = "7.1", optional = true }
ab_glyph = { version = "0.2", optional = true }
png = { version = "0.17", optional = true }
# QR matrix generation for on-glass pairing codes (the FCast connection URL,
# #248; Matter commissioning and the remote-control URL are the anticipated
# reuse). A pure-algorithm format library, the flatbuffers/serde carve-out — the
# `qr` module wraps it so nothing else names the crate.
qrcodegen = { version = "1.8", optional = true }
# Decoding cover art for the now-playing card: **every decoder this crate has**, which is
# the point rather than an oversight. Cover art is whatever bytes a phone, a CDN or some
# DLNA server chose to send, and a panel that cannot draw a picture because the sender
# picked WebP is a worse outcome than a slightly larger binary. `castaway_core::ImageFormat`
# is kept in step with this list, and `nowplaying_card` has a test that fails if the two
# drift — which they had, jpeg+png here against four formats there, so a GIF thumbnail
# parsed as valid at the boundary and then failed to decode in exactly the place that
# enum's docstring says cannot happen (#87).
#
# This is `default-formats` minus `avif`, and the omission is the one honest gate. In
# `image` 0.25 the `avif` feature is the **encoder** (ravif); decoding AVIF needs
# `avif-native`, which is dav1d — a C library, and the pure-Rust rule here is what keeps
# the Windows cross-build a cross-build. So AVIF is absent from this list and from the
# enum, and an AVIF cover is refused at the boundary rather than three layers down.
image = { version = "0.25", default-features = false, features = [
    "rayon",
    "bmp",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
], optional = true }
# Brave's adblock engine — request-level ad/tracker blocking in the browser host, which
# is what answered #44. Drop the default `single-thread` feature so the Engine is Arc-based
# (Send+Sync) — resource queries arrive across threads. Keep `embedded-domain-resolver`
# (needed for URL parsing) and `full-regex-handling`.
base64 = { workspace = true, optional = true }
# SVG rasterisation for the tile glyphs. They used to be hand-rolled distance fields, and
# every one that looked wrong was a geometry bug in this repo rather than in the artwork
# (see `assets/glyphs/README.md`). `text` is off because the marks are pure paths — it
# would pull in fontdb and a font database lookup for nothing. Pure Rust, so the Windows
# cross-build is unaffected.
resvg = { version = "0.45", default-features = false, optional = true }
# A JS engine, to evaluate uBlock Origin's scriptlet modules and read their own registry
# rather than parsing them. Cross-builds for the Windows MSVC target (checked).
rquickjs = { version = "0.12", features = ["loader"], optional = true }
adblock = { version = "0.13", optional = true, default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
    # Turns uBlock Origin's own `scriptlets.js` into engine resources, so `##+js(...)`
    # rules have bodies to inject rather than matching and doing nothing.
    "resource-assembler",
] }
# Blocking HTTP client to fetch+cache EasyList at startup.
ureq = { version = "2", optional = true }
# Cross-platform audio output: ALSA on Linux, WASAPI on Windows.
cpal = { version = "0.18", optional = true }
# The LDAC decoder. The only A2DP codec libav has no decoder for, so the only one that
# needs a second decode backend beside ffmpeg (#14). Sony's own library, via nixpkgs
# `ldacbt`; the safe wrapper is `ldac_decode` and it is the only consumer.
ldac-sys = { workspace = true, optional = true }
interprocess = { version = "2.4.3", default-features = false }

# The remote-control UI's transport (#18). Optional only because it is a large tree a
# headless or test build has no use for; `render` turns it on, for the same reason
# `render` turns on `stream` — a build that can draw can serve what it drew, and gating
# the two apart would only produce builds where /remote/ exists and structurally cannot
# work.
webrtc = { workspace = true, optional = true }
# The sans-I/O core `webrtc` is a thin async layer over. A direct dependency because the
# types the API takes — media engine, codec parameters, SDP, samples — live here and are
# not re-exported; version-locked to `webrtc` for the same reason `ash` is to `wgpu-hal`.
#
# **Not optional, unlike `webrtc` above.** `mirror_in::assemble` is compiled in every build
# on purpose — it is the pure reassembly half, and its fixtures should run everywhere — and
# it depacketises with `rtc::rtp`. Gating this crate behind `remote` made that module
# unbuildable in exactly the headless feature sets CI runs most (`--features audio` and
# friends), which is D55's failure mode verbatim: a feature that is off is code nothing
# compiles. `rtc` is pure Rust with no native deps, so carrying it unconditionally costs a
# compile and nothing else. The heavy async tree stays behind `remote`.
rtc = "0.20"

# The native PipeWire output backend (`audio-pipewire`): real sink names for the
# settings screen and per-stream routing via `target.object`, neither of which the ALSA
# compatibility shim can express. Linux-only by nature — the Windows panel reaches
# WASAPI through cpal — hence the target table below.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.8", optional = true }

# --- hwaccel interop (optional; per-platform) ---
# Version-locked to what `wgpu-hal` 22 itself links, because these types cross the
# `wgpu::hal` boundary: a different `ash` or `d3d12` would be a different `vk::Image` /
# `ID3D12Resource` as far as the type system is concerned. `wgpu-hal` itself is reached
# through wgpu's own `wgpu::hal` re-export rather than a direct dependency, so it cannot
# drift from the wgpu we link.
[target.'cfg(unix)'.dependencies]
ash = { version = "0.38", optional = true }
# The browser host's SCM_RIGHTS sender (#271). The rlib half is depended on for one
# constant — the cdylib's file name, so the spawner and the artifact cannot drift — and
# depending on it is also what makes `cargo build`/`cargo test` produce the cdylib the
# host app dlopens.
castaway-browser-fd = { workspace = true, optional = true }
# `pidfd_open`/`pidfd_getfd` for pulling browser frame descriptors (hwaccel::remote_handle).
# Declared through libc rather than an `extern "C"` block because the syscall numbers are
# per-architecture and getting one wrong is a silent call to something else entirely.
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
# Not optional: `keepawake` is compiled in every Windows build, not just hwaccel ones —
# a receiver that lets the monitor sleep mid-playback loses its audio device with it.
winapi = { version = "0.3", features = [
    "d3d11",
    "d3d12",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "handleapi",
    # `DuplicateHandle` needs `GetCurrentProcess` as its target: pulling the browser's
    # shared-texture handles into this process (D36, hwaccel::remote_handle).
    "processthreadsapi",
    "winerror",
    "winnt",
    # SetThreadExecutionState, for holding the display awake during playback (#109).
    "winbase",
] }
d3d12 = { version = "22", optional = true }

[dev-dependencies]
base64.workspace = true
# Decoding the blessed PNGs in `tests/golden_scenes.rs`. The crate itself only *encodes*
# (`attract::to_png`), and a golden-image test has to read one back (#203). Same crate the
# card already decodes cover art with, so this adds nothing to the build.
image = { version = "0.25", default-features = false, features = ["png"] }
# The output-stream round trip writes its segments somewhere libavformat can open them.
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
serde.workspace = true
serde_json.workspace = true

[features]
# Everything, because a feature that is off is a feature nothing tests (D55).
#
# These were opt-in so `castaway-portable` could be built without wgpu, ffmpeg, Electron
# and the rest. That build is gone, and with it the only reason: the fine-grained graph
# was buying exactly one artifact while costing 140 tests that no CI check compiled, a
# `--features ffmpeg` build that was broken on `main` for an unknown time (#180), and the
# standing inversion where `cargo test` exercised the configuration we did *not* ship.
#
# Nothing here is a user-facing choice. What a receiver does or does not do is a *runtime*
# decision — `[enable]` in castaway.toml, the codec table, DIAL's launch-target check —
# and runtime decisions are the ones that can be tested. The feature names stay because
# 235 `cfg` sites read them and because the Windows cross-build genuinely cannot take
# `audio-pipewire`; they are mechanism now, not policy.
#
# Linux-buildable set. `windows.nix` passes `--no-default-features` and names its own.
default = [
    "render",
    "kiosk",
    "ffmpeg",
    "libav-sys",
    "stream",
    "remote",
    "audio",
    "audio-out",
    "audio-pipewire",
    "ldac",
    "hwaccel",
    "electron",
]
# `render` = the wgpu Compositor backend (feature can't be named `wgpu` — that's a dep).
# `kiosk`  = winit fullscreen output driving the compositor.
# `ffmpeg` = libav decode. `electron` (below) = the offscreen browser.
render = [
    "dep:wgpu",
    "dep:pollster",
    "dep:bytemuck",
    "dep:ab_glyph",
    "dep:png",
    "dep:image",
    "dep:resvg",
    "dep:qrcodegen",
]
kiosk = ["render", "dep:winit", "dep:raw-window-handle"]
ffmpeg = ["dep:ffmpeg-next"]
# Internal: "raw libav is linked". Set by every feature that reaches past `ffmpeg-next`
# into `ffmpeg-sys-next`, so the helpers shared across those paths (`crate::av`) carry one
# cfg rather than a list of feature names that goes stale the next time one is added.
libav-sys = ["dep:ffmpeg-sys-next"]
# The composited output, duplicated as an HLS stream (#101). Needs both halves for the
# same reason `hwaccel` does: `render` produces the frames and converts them to NV12 on
# the GPU, `ffmpeg` encodes them. Which *encoder* opens is a runtime decision — the
# candidate table in `stream::encoder` prefers the vendor ones and falls back to
# software — so this flag gates whether a build can stream at all, never how.
#
# The boxing, segmenting and cadence are pure and compiled without it, so their fixtures
# run in every build rather than only where a GPU exists.
# `audio` is not optional: the stream's own audio track is tapped at the `AudioOut`
# factory, so it needs `PcmBlock` and libswresample. It does not need an output *device* —
# a headless build still encodes what the sessions produced.
stream = ["render", "ffmpeg", "audio", "libav-sys"]
# WebRTC: the low-latency duplicate and the input channel behind it (#18).
# Needs `stream`, which is where the encoder it feeds from lives.
remote = ["stream", "dep:webrtc"]
# `audio` = A2DP/audio decode (libav) plus a PCM output device (cpal). Separate from
# `ffmpeg` because the decoders are useful in tests without pulling in an audio device,
# and a headless CI box has no sound card.
audio = ["ffmpeg", "libav-sys"]
audio-out = ["audio", "dep:cpal"]
# The native PipeWire backend. On Linux it takes precedence over `audio-out`'s
# ALSA host (see `audio_select::active_backend`); on Windows it is inert, so a shared
# feature list cross-builds cleanly.
audio-pipewire = ["audio", "dep:pipewire"]
# The LDAC decoder, over FFI to Sony's own `libldacBT` (#14). Its own feature because it
# is the one decoder that is not already in the ffmpeg the rest of `audio` links: a build
# without `ldacbt` available would fail to link rather than fail to decode. In the default
# set since D55; a build without the library opts out by naming its features. Implies
# `audio` because the PCM it produces goes through the same session and output path.
#
# The feature no longer merely reserves a slot. `can_decode` asks whether a decoder
# exists rather than whether this flag is set, so with it off the LDAC endpoint is absent
# from the advertised table and with it on the endpoint is backed by something real —
# which is what the flag failing to mean anything cost us the first time (#14).
ldac = ["audio", "dep:ldac-sys"]
# `hwaccel` gates whether the hardware decode backends are *compiled*, never whether they
# are *used* — that is a runtime decision (`HwPreference`), so a build with this on still
# plays on a box with no GPU decode. Needs both halves: `ffmpeg` produces the surfaces and
# `render` is what imports and samples them.
hwaccel = [
    "ffmpeg",
    "render",
    "libav-sys",
    "dep:ash",
    "dep:libc",
    "dep:d3d12",
]
# The browser subprocess (D36). Needs `render` for the compositor it paints into and
# `hwaccel` for the zero-copy frame import; adblock and scriptlets are baked in because a
# browser on a wall with no ad blocking is not a thing we would ship.
# `audio` is not optional here: the browser's audio is captured out of the page and mixed
# by us (D36), so a browser build without the audio path would be a YouTube that plays
# silently — which is exactly the class of failure G61 was.
electron = [
    "render",
    "hwaccel",
    "audio",
    "dep:adblock",
    "dep:ureq",
    "dep:base64",
    "dep:rquickjs",
    "dep:castaway-browser-fd",
]

[lints]
workspace = true

[[example]]
name = "attract_preview"
required-features = ["render"]

# The now-playing surface, rendered to a PNG so a change to it can be reviewed without a
# panel attached — the sibling of `attract_preview` for the other idle-ish screen.
[[example]]
name = "card_preview"
required-features = ["render"]

[[example]]
name = "screen_preview"
required-features = ["render"]

# Regenerates the checked-in window/desktop icon rasters from
# assets/brand/castaway-icon.svg — the artifacts are committed, so this only
# needs re-running when the artwork changes.
[[example]]
name = "icon_render"
required-features = ["render"]

# Every shell screen — Home, a service's instructions, a picker with rows and one with
# none — dumped to PNGs. Layout and hit-testing are unit-tested; whether a screen reads
# from across a room is not something a test can answer (D38).
[[example]]
name = "shell_preview"
required-features = ["render"]

# Stage 0 of #111: the audio device's clock against CLOCK_MONOTONIC, in ppm. Needs a real
# output device — the whole point is to measure one — so it is an example rather than a
# test: CI has no sound card and the answer is hardware's, not the code's.
[[example]]
name = "audio_drift"
required-features = ["audio-out"]

# How fast the media clock actually advances against the wall, on a real file. Written to
# find #52 — the demuxer deadlocking against a clock only it could advance — and kept
# because "plays in real time" is not a property any offline fixture can state.
[[example]]
name = "media_clock_rate"
required-features = ["ffmpeg", "audio"]

[[test]]
name = "hwaccel_zero_copy"
required-features = ["hwaccel"]

# The output duplicate, end to end and back through libavformat (#101). Needs a GPU and an
# H.264 encoder; where either is missing it says so and passes.
[[test]]
name = "output_stream"
required-features = ["stream"]

# The remote transport, negotiated against real sockets (#18). No GPU: what is under test
# is that an offer is answered with something a browser could use, not the pictures.
[[test]]
name = "remote_negotiation"
required-features = ["remote"]

# The same transport, but with a real browser on the far end (#18). Needs a GPU and an
# Electron, so `#[ignore]` and run by name — see the file's own header.
[[test]]
name = "remote_browser"
required-features = ["remote", "electron"]

# Regenerates the checked-in LDAC test vectors with the library's own encoder. Not part of
# any test run — the fixtures it writes are, and they are checked in so the decode tests do
# not need an encoder (or this feature) to have bytes to chew on.
[[example]]
name = "ldac_fixtures"
required-features = ["ldac"]

[[test]]
name = "ldac_decode"
required-features = ["ldac"]
