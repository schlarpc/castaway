[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Media pipeline: the null (log) backend used for daily dev, plus the Compositor/Decoder/Browser trait surfaces the ffmpeg + wgpu + CEF backends slot behind feature flags."

[dependencies]
castaway-core.workspace = true
# The InputSink/TouchEvent/PointerEvent interface: the kiosk routes window input to the
# focused surface (the CEF browser today) through it.
input-touch.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
bytes.workspace = true

# --- real render backends (optional; default off, DECISION-LOG D4) ---
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
ffmpeg-next = { version = "7.1", optional = true }
# Raw libav for the hwaccel path: `ffmpeg-next` 7.1 wraps none of `hw_device_ctx`,
# `get_format`, or `AVHWFramesContext`, so those go through the -sys crate it already
# depends on (same version, so there is only ever one libav binding in the tree).
ffmpeg-sys-next = { version = "7.1", optional = true }
ab_glyph = { version = "0.2", optional = true }
png = { version = "0.17", optional = true }
# Decoding cover art for the now-playing card. JPEG and PNG only — that is what AVRCP/BIP
# and Spotify actually return, and the default feature set drags in a dozen formats plus
# rayon. Pure Rust, so it does not complicate the Windows cross-build.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
], optional = true }
# CEF (offscreen browser). Pinned to the CEF 147.0.10 build so it matches the nixpkgs
# `cef-binary` the flake points CEF_PATH at (flake.nix cefDist). If nixpkgs bumps
# cef-binary, bump these together.
cef = { version = "=147.1.0", optional = true }
cef-dll-sys = { version = "=147.1.0", optional = true }
# Brave's adblock engine — request-level ad/tracker blocking in the CEF host (Q6 answer).
# Drop the default `single-thread` feature so the Engine is Arc-based (Send+Sync) — CEF
# calls the resource handler across threads. Keep `embedded-domain-resolver` (needed for
# URL parsing) and `full-regex-handling`.
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# A JS engine, to evaluate uBlock Origin's scriptlet modules and read their own registry
# rather than parsing them. Cross-builds for the Windows MSVC target (checked).
rquickjs = { version = "0.9", features = ["loader"], optional = true }
adblock = { version = "0.13", optional = true, default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
    # Turns uBlock Origin's own `scriptlets.js` into engine resources, so `##+js(...)`
    # rules have bodies to inject rather than matching and doing nothing.
    "resource-assembler",
] }
# Blocking HTTP client to fetch+cache EasyList at startup.
ureq = { version = "2", optional = true }
# Cross-platform audio output: ALSA on Linux, WASAPI on Windows.
cpal = { version = "0.15", optional = true }

# --- hwaccel interop (optional; per-platform) ---
# Version-locked to what `wgpu-hal` 22 itself links, because these types cross the
# `wgpu::hal` boundary: a different `ash` or `d3d12` would be a different `vk::Image` /
# `ID3D12Resource` as far as the type system is concerned. `wgpu-hal` itself is reached
# through wgpu's own `wgpu::hal` re-export rather than a direct dependency, so it cannot
# drift from the wgpu we link.
[target.'cfg(unix)'.dependencies]
ash = { version = "0.38", optional = true }
# `pidfd_open`/`pidfd_getfd` for pulling browser frame descriptors (hwaccel::remote_handle).
# Declared through libc rather than an `extern "C"` block because the syscall numbers are
# per-architecture and getting one wrong is a silent call to something else entirely.
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", optional = true, features = [
    "d3d11",
    "d3d12",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "handleapi",
    # `DuplicateHandle` needs `GetCurrentProcess` as its target: pulling the browser's
    # shared-texture handles into this process (D36, hwaccel::remote_handle).
    "processthreadsapi",
    "winerror",
    "winnt",
] }
d3d12 = { version = "22", optional = true }

[dev-dependencies]
base64.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
serde.workspace = true
serde_json.workspace = true

# The Q40 spike example only: `pidfd_getfd` to pull dmabuf fds out of the Electron child.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# The D36 gate (OPEN-QUESTIONS Q40): drives browser-host/ under Electron and imports its
# shared-texture frames into a wgpu device. Linux-only by nature (pidfd + dmabuf).
[[example]]
name = "electron_osr"
required-features = ["hwaccel"]

[features]
default = []
# `render` = the wgpu Compositor backend (feature can't be named `wgpu` — that's a dep).
# `kiosk`  = winit fullscreen output driving the compositor.
# `ffmpeg` = libav decode. `cef` = offscreen browser (still a marker; Q6).
render = [
    "dep:wgpu",
    "dep:pollster",
    "dep:bytemuck",
    "dep:ab_glyph",
    "dep:png",
    "dep:image",
]
kiosk = ["render", "dep:winit", "dep:raw-window-handle"]
ffmpeg = ["dep:ffmpeg-next"]
# `audio` = A2DP/audio decode (libav) plus a PCM output device (cpal). Separate from
# `ffmpeg` because the decoders are useful in tests without pulling in an audio device,
# and a headless CI box has no sound card.
audio = ["ffmpeg", "dep:ffmpeg-sys-next"]
audio-out = ["audio", "dep:cpal"]
# LDAC has no libav decoder and AOSP's libldac is encoder-only, so this needs the
# reverse-engineered libldacdec (Q22). Without it the LDAC endpoint must not be
# advertised at all.
ldac = ["audio"]
# `hwaccel` gates whether the hardware decode backends are *compiled*, never whether they
# are *used* — that is a runtime decision (`HwPreference`), so a build with this on still
# plays on a box with no GPU decode. Needs both halves: `ffmpeg` produces the surfaces and
# `render` is what imports and samples them.
hwaccel = [
    "ffmpeg",
    "render",
    "dep:ffmpeg-sys-next",
    "dep:ash",
    "dep:libc",
    "dep:winapi",
    "dep:d3d12",
]
# `cef` needs `render` for the compositor it paints into; adblock is baked in.
cef = ["render", "dep:cef", "dep:cef-dll-sys", "dep:adblock", "dep:ureq", "dep:base64", "dep:serde_json", "dep:serde", "dep:rquickjs"]

[lints]
workspace = true

[[example]]
name = "attract_preview"
required-features = ["render"]

# The now-playing surface, rendered to a PNG so a change to it can be reviewed without a
# panel attached — the sibling of `attract_preview` for the other idle-ish screen.
[[example]]
name = "card_preview"
required-features = ["render"]

[[example]]
name = "screen_preview"
required-features = ["render"]

[[example]]
name = "cef_shot"
required-features = ["cef"]

[[example]]
name = "idle_preview"
required-features = ["cef"]

[[test]]
name = "hwaccel_zero_copy"
required-features = ["hwaccel"]
