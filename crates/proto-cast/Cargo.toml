[package]
name = "proto-cast"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Google Cast (CASTv2) receiver: framing, device-auth handshake, and the pure session state machine for media-URL LOAD and (later) mirroring."

[dependencies]
castaway-core.workspace = true
crypto-cast-auth.workspace = true
# The replay-based device credential. `CksIdentity` is where the TLS certificate and
# the precomputed signature are drawn from one value rather than chosen separately.
cast-replay.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
aes.workspace = true
ctr.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time", "sync"] }
# The receiver-platform WebSocket a hosted application's SDK dials. axum is already the
# HTTP surface for five protocols here; `ws` is the one feature it needs beyond default.
axum = { workspace = true, features = ["ws"] }
futures.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rcgen.workspace = true
time.workspace = true

[dev-dependencies]
hex-literal.workspace = true
tokio-tungstenite.workspace = true
# The receiver-SDK test drives Electron as a child process and reads its report.
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
x509-parser.workspace = true
rsa.workspace = true
base64.workspace = true

[lints]
workspace = true
