[package]
name = "proto-matter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Matter Casting receiver: the Casting Video Player role — UDC, the fabric we administer, and the media clusters a Casting Client invokes."

[dependencies]
castaway-core.workspace = true
substrate-mdns.workspace = true
rs-matter.workspace = true
# Not used directly — depended on so their `std` features are unified into rs-matter's
# graph. `embassy-time` has no time driver without one, and the MRP retransmit timer
# then fails to *link* rather than to compile: `_embassy_time_now` undefined.
embassy-time.workspace = true
critical-section.workspace = true
embassy-time-queue-utils.workspace = true
# rs-matter's own RNG trait bound; the `Dataver`s and the handler chain take one.
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "net", "time"] }
async-trait.workspace = true

[dev-dependencies]
# `test-util` for `start_paused`: the passcode window is 180 s and the test that proves it
# comes off the screen on its own asserts against the constant the panel ships with, not
# against a shortened one (#197).
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time", "net", "test-util"] }
tempfile.workspace = true
# For `examples/matter-peer.rs`, the scripted Casting Client the VM test drives. Its
# `tracing-log` default feature is what makes `rs-matter`'s own `log` records visible,
# which is most of what you have to read when commissioning fails.
tracing-subscriber.workspace = true

[lints]
workspace = true
