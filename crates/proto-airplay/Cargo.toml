[package]
name = "proto-airplay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "AirPlay receiver: mDNS advertisements, /info, and the RTSP dispatch state machine. Mirroring media is gated on FairPlay-SAP (crypto-fairplay, Q1)."

[dependencies]
castaway-core.workspace = true
substrate-mdns.workspace = true
substrate-rtsp.workspace = true
crypto-fairplay.workspace = true
crypto-raop.workspace = true
thiserror.workspace = true
tracing.workspace = true
plist.workspace = true
base64.workspace = true
aes.workspace = true
cbc.workspace = true
bytes.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync"] }

[dev-dependencies]
# The SDP tests wrap a session key the way a sender does, so the unwrap is exercised
# end to end rather than mocked.
rsa.workspace = true
sha1.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
