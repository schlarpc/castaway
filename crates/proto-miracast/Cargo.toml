[package]
name = "proto-miracast"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Miracast / Wi-Fi Display sink: the WFD information element, the wfd-kv parameter grammar, the M1-M16 RTSP state machine, and MPEG2-TS-over-RTP depacketization."

[dependencies]
castaway-core.workspace = true
substrate-rtsp.workspace = true
substrate-rtp.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
# The MS-MICE PIN challenge is a salted SHA-256 (§3.1.5.6.1).
sha2.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync", "time", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

# The `wfd-probe` example only. Windows exposes autonomous group ownership and vendor IE
# injection through WinRT, so the spike for a Windows backend (§7.7(c) of
# docs/miracast-protocol-notes.md) needs the projection; the crate itself does not.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
  "Devices_WiFiDirect",
  "Foundation",
  "Foundation_Collections",
  "Security_Cryptography",
  "Storage_Streams",
] }

[lints]
workspace = true
