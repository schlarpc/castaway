[package]
name = "hci-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "HciTransport backends (USB/WinUSB, Linux HCI_CHANNEL_USER) and the ControllerInit registry that loads vendor firmware."
build = "build.rs"

[dependencies]
substrate-hci.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
# Pure-Rust USB, so the transport needs no libusb and no unsafe. Same code drives a
# dongle on Linux and a WinUSB-bound one on Windows.
# `tokio` is not optional dressing: nusb 0.2 models its blocking syscalls as a
# `MaybeFuture`, which can be `.wait()`ed synchronously *or* awaited — and awaiting one
# without this feature does not fail to compile, it **panics at runtime** with "Awaiting
# blocking syscall without an async runtime". The one place we await one is the endpoint
# stall recovery in `usb.rs`, so the panic hid on a path nothing exercises until a
# controller actually stalls — which one did, mid-session, taking the receiver down at the
# exact moment its recovery code was about to run. With the feature on, the call goes to
# `tokio::task::spawn_blocking`, which is where a blocking ioctl belongs anyway (rule 4).
nusb = { version = "0.2", optional = true, features = ["tokio"] }
futures = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[[example]]
name = "probe"
required-features = ["usb"]

[[example]]
name = "vhci"
required-features = ["socket"]

[features]
default = ["usb"]
# The USB backend. Works on both platforms; the only one Windows can use.
usb = ["dep:nusb", "dep:futures"]
# The Linux raw-HCI socket. A convenience for working on the layers above: it hands over
# a controller the kernel has *already* initialised, so it cannot exercise ControllerInit.
socket = ["dep:libc", "tokio/net"]

[lints]
workspace = true
