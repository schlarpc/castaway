[package]
name = "castaway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Universal cast receiver: one binary terminating AirPlay, Cast, Miracast, DLNA, YouTube Lounge, and Spotify Connect."
default-run = "castaway"

[[bin]]
name = "castaway"
path = "src/main.rs"

[dependencies]
castaway-core.workspace = true
castaway-paths.workspace = true
substrate-ssdp.workspace = true
substrate-mdns.workspace = true
proto-dlna.workspace = true
proto-cast.workspace = true
crypto-cast-auth.workspace = true
cast-replay.workspace = true
cast-registry.workspace = true
proto-spotify.workspace = true
proto-bluetooth-audio.workspace = true
hci-transport.workspace = true
substrate-hci.workspace = true
proto-airplay.workspace = true
proto-miracast.workspace = true
proto-matter.workspace = true
proto-gamestream.workspace = true
proto-dial.workspace = true
sponsorblock.workspace = true
pipeline.workspace = true
control-display.workspace = true
input-touch.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }
toml = "0.8"
# The settings screen writes config *back*. `toml_edit` rather than serializing the
# `Config` structs, because an operator's file is full of comments and hand-formatting
# that a round-trip through serde would flatten; this edits one key and leaves the rest
# byte-for-byte alone. (Same tree `toml` itself parses with, so no new lock entry.)
toml_edit = "0.22"
uuid.workspace = true
url.workspace = true


# The unix half of the single-instance guard (#100). `flock` rather than a PID file so
# the lock dies with the process however it dies; rustix rather than raw libc so the
# wiring crate needs no `unsafe`. Already in the lock file via other dependencies.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
# The shared deadline poll (#236).
castaway-test-support.workspace = true
# `test-util` for `start_paused`: the DIAL screen tests wait out the resolver windows in
# virtual time rather than sleeping them (#236).
tokio = { workspace = true, features = ["test-util"] }
# Driving the DLNA media plane end to end, and the `/stream/*` routes without a socket:
# a real request into the real router.
tower = { version = "0.5", features = ["util"] }
# The A2DP packets `tests/bluetooth_audio_decodes.rs` feeds the real depacketiser. This
# crate is the only one that depends on both the protocol half and the decode half, which
# is why the seam between them is tested here (#187).
bytes.workspace = true
# Acting as an encrypting RAOP sender in `tests/airplay_audio_decodes.rs` (#189): wrap
# an AES key with the AirPort public half, CBC-encrypt the packets the way an iPhone
# does, and prove the session decrypts to the same PCM as the clear run.
crypto-raop.workspace = true
rsa.workspace = true
aes.workspace = true
cbc.workspace = true
base64.workspace = true
sha1.workspace = true

[build-dependencies]
# Embeds assets/castaway.rc (the .exe icon) when the *target* is Windows — which is
# why this is an unconditional build-dependency rather than a `[target...]` one:
# cargo matches those tables against the host, and the Windows build is a cross
# build from Linux. Chosen over winresource because it drives `llvm-rc`, which is
# the resource compiler nix/windows.nix actually ships.
embed-resource = "3"

[features]
# Everything the Linux kiosk ships, because that is the artifact and it should be the
# thing `cargo test` builds (D55). `windows.nix` passes `--no-default-features` and names
# its own set; `audio-pipewire` is the only entry that is genuinely Linux-only.
#
# `gamestream` is in here, which makes a default build GPL-3.0-bound via
# moonlight-common-c (D37). That was previously the one gate with a safety argument
# behind it, and it was dropped deliberately: this tree is n=1 and private, nothing is
# redistributed, and an untested streaming path was the larger risk. If a binary ever
# does get handed to somebody, that is the moment to care — the source stays MIT either
# way, and only the linked artifact is affected.
default = [
    "render",
    "stream",
    "remote",
    "hwaccel",
    "audio",
    "audio-out",
    "audio-pipewire",
    "bluetooth-socket",
    "ldac",
    "electron",
    "gamestream",
]
# Real render output: swap NullPipeline → RenderPipeline (ffmpeg decode + wgpu compositor)
# and run the winit fullscreen kiosk on the main thread. Native deps required (see flake).
# Also brings the output duplicate (#101): anything that can draw can stream what it
# drew, and gating that separately would only produce builds where `/stream/*` exists and
# structurally cannot work. Which *encoder* opens is still a runtime probe.
# `audio` comes with it: the stream's audio track is tapped at the `AudioOut` factory, and
# without the decode path there is no factory to tap — a renderer that cannot duplicate its
# own sound is not a trade worth having, and on a box with no output device the sessions
# still decode into a null sink and the stream still carries them.
render = [
    "pipeline/kiosk",
    "pipeline/ffmpeg",
    "pipeline/stream",
    "pipeline/remote",
    "stream",
    "remote",
    "audio",
]
# Internal: mirrors `pipeline/stream` so `crates/app` can `cfg` on it directly.
stream = []
# Internal: likewise for `pipeline/remote`, the remote-control UI (#18).
remote = []
# Compile the hardware decode backends (VA-API on Linux, D3D11VA on Windows). Whether they
# are *used* is a runtime decision, so this is safe to leave on: a box with no GPU decode
# still plays, on the CPU, with a log line saying so.
hwaccel = ["render", "pipeline/hwaccel"]
# A2DP audio decode (libav) with no output device — what CI builds, since a headless
# box has no sound card and the null sink still proves the whole path ran.
audio = ["pipeline/audio"]
# Reach a controller through the kernel's raw HCI socket instead of USB. Linux only.
# What the no-hardware integration test uses, against a btvirt virtual controller.
bluetooth-socket = ["hci-transport/socket"]
# …and the real PCM device (ALSA / WASAPI). What the kiosk ships with.
audio-out = ["audio", "pipeline/audio-out"]
# …or PipeWire natively (Linux), which is what makes output-device *selection* real
# there: the ALSA shim shows one "pipewire" device, the native backend shows the sinks.
# Takes precedence over audio-out's ALSA host at compile time; inert on Windows.
audio-pipewire = ["audio", "pipeline/audio-pipewire"]
# LDAC decode, over FFI to Sony's own library (#14). Off by default
# because it needs `LDACBT_LIB_DIR` at link time, not because the decoder is in doubt —
# a build without it would fail to link rather than fail to decode.
#
# Note that this feature compiling in the decoder is *not* the same as advertising the
# endpoint. Even with it on, LDAC is in `bluetooth::OPT_IN` and stays out of the
# advertised table until the config names it, because it sits first in preference order
# and would otherwise silently become what every capable sender negotiates.
ldac = ["audio", "pipeline/ldac", "proto-bluetooth-audio/ldac"]
# The browser subprocess in the kiosk (YouTube leanback via DIAL launch). Implies
# `render` and `hwaccel` for the zero-copy frame import. Unlike the CEF build it replaced,
# this binary is *not* also the browser's subprocess entry point, so main() is ordinary.
electron = ["render", "hwaccel", "audio", "pipeline/electron", "dep:ureq"]
# Link moonlight-common-c so the GameStream client can actually stream (D37). Off by
# default deliberately: the library is GPL-3.0 against this MIT tree, and it needs
# MOONLIGHT_COMMON_C_LIB_DIR at link time. Without it the client still discovers,
# pairs, and lists apps — it just declines to start a session it could not display.
gamestream = ["proto-gamestream/stream"]

[lints]
workspace = true
